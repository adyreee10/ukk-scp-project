name: Deploy to Hosting via FTPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy via FTPS
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Install NPM Dependencies & Build Assets
        run: |
          npm ci
          npm run build

      - name: 4. Deploy Files to Hosting via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER || secrets.SFTP_HOST }}
          username: ${{ secrets.FTP_USERNAME || secrets.SFTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD || secrets.SFTP_PASSWORD }}
          port: 21
          protocol: ftps
          server-dir: 'public_html/'
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .env
            .env.*
            database/*.sqlite*
            storage/**
            public/storage
            tests/**
            README.md
